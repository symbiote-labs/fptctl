name: Library watch

# Once a day, look for a shotgun-api3 release newer than the pin. When there is one, open an issue
# (once per version) listing how its public API changed. skills/fptctl-library-upgrade takes it from
# there.
#
# Two jobs, because inspecting a new release installs and imports code nobody has reviewed yet.
# That job can only read the repository and keeps no credentials in its checkout. It hands over
# report.json only. The job that can open issues runs none of the library's code, re-reads both
# versions itself, validates the report's shape and size, and renders the issue itself.
on:
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  inspect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      - run: uv run --no-project python -m scripts.library_watch --report-dir report
      - uses: actions/upload-artifact@v7
        with:
          name: library-report
          path: report/
          if-no-files-found: ignore

  issue:
    needs: inspect
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v7
        continue-on-error: true  # no artifact when there is no new release; the step below checks
        with:
          name: library-report
          path: report
      - run: python3 -m scripts.library_watch --open-issue report
        env:
          GH_TOKEN: ${{ github.token }}
